name: ci

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Validate deterministic R rewrite
        run: python3 scripts/validate_scaffold.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t r-stakeholder .
      - name: Smoke test
        run: docker run --rm r-stakeholder --output-format json --seed 42 --focus-family code-analyzer
