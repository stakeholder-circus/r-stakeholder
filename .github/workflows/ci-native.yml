name: ci-native

on:
  push:
  pull_request:

jobs:
  r-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: Rscript -e 'sessionInfo()'
      - run: python3 scripts/validate_scaffold.py
